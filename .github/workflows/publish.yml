name: Publish

# Never cancel a release in flight. On push every merge to main shares one group, so cancelling would let the
# next merge kill a run that may already have tagged and cut the release but not yet finished publishing.
# This also retires the hazard the pull_request trigger had, where a consolidation merge closed several pull
# requests at once and their simultaneous runs cancelled each other: one push is one run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  # Releasing on push rather than on the pull_request closed event is deliberate. A pull request from a fork
  # runs with a read-only GITHUB_TOKEN and no secrets even on merge, so it cannot create the release or reach
  # the publishing credentials - which is how a merged, labeled fork contribution silently released nothing.
  # A push to main always runs with a full-permission token, and the release action finds the merged pull
  # request and its label from the commit.
  push:
    branches:
      - main
    paths:
      - "Source/**"

permissions:
  contents: write
  deployments: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  build:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}

      - name: Yarn install
        working-directory: ./Source
        run: yarn

      - name: Set extension version
        working-directory: ./Source
        run: |
          jq --arg version "${{ needs.release.outputs.version }}" \
            '.version = $version' manifest.json > manifest.tmp.json && \
            mv manifest.tmp.json manifest.json

      - name: Build
        working-directory: ./Source
        run: yarn build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: Source/dist/
          retention-days: 1

  publish-chrome:
    if: needs.release.outputs.publish == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, build]

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: dist/

      - name: Package extension
        run: cd dist && zip -r ../extension-chrome.zip .

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: extension-chrome.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  publish-edge:
    if: needs.release.outputs.publish == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, build]

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: dist/

      - name: Package extension
        run: cd dist && zip -r ../extension-edge.zip .

      - name: Publish to Microsoft Edge Add-ons
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: extension-edge.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          client-secret: ${{ secrets.EDGE_CLIENT_SECRET }}
          access-token-url: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}

  publish-firefox:
    if: needs.release.outputs.publish == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x

      # No dependency install here: web-ext is not a project dependency, npx fetches it on demand,
      # and this job only signs the already-built artifact.
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: Source/dist/

      - name: Sign and publish to Firefox Add-ons (AMO)
        working-directory: ./Source
        run: |
          npx web-ext sign \
            --source-dir dist/ \
            --artifacts-dir artifacts/ \
            --channel listed \
            --api-key ${{ secrets.FIREFOX_API_KEY }} \
            --api-secret ${{ secrets.FIREFOX_API_SECRET }}

  publish-safari:
    if: needs.release.outputs.publish == 'true' && needs.release.outputs.prerelease == 'false'
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [release, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Safari packaging is pure Xcode tooling against the built artifact -- no Node, no dependencies.
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: Source/dist/

      - name: Convert web extension to Safari extension
        working-directory: ./Source
        run: |
          xcrun safari-web-extension-converter dist/ \
            --project-location safari-extension/ \
            --app-name "Lens" \
            --bundle-identifier com.cratis.lens \
            --no-open

      - name: Build Safari extension
        working-directory: ./Source/safari-extension
        run: |
          xcodebuild -scheme "Lens (macOS)" \
            -configuration Release \
            -archivePath build/Lens-macOS.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Export and upload to App Store Connect
        working-directory: ./Source/safari-extension
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Lens-macOS.xcarchive \
            -exportPath build/export/ \
            -exportOptionsPlist ../ExportOptions.plist \
            -allowProvisioningUpdates \
            API_KEY_ID="${{ secrets.APPLE_API_KEY_ID }}" \
            API_KEY_ISSUER_ID="${{ secrets.APPLE_API_ISSUER_ID }}"

  verify-published:
    # A merge that publishes nothing is the failure mode that silently costs a release: the release job
    # succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did.
    #
    # Only for the reasons that mean something went wrong. Publishing nothing is correct and routine for the
    # others - a commit pushed straight to main, a Dependabot merge, a re-run of a run that already released -
    # and failing on those would make this job noise that everyone learns to ignore.
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::Nothing was published and no release was cut (reason: ${{ needs.release.outputs.reason }}). For 'no-label', add exactly one of major, minor or patch to the merged pull request and re-run this workflow - see verify-semver-label, which is meant to catch this before the merge."
          exit 1
